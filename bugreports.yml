  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Просмотреть каталог товаров
  expected-result: |
    На странице отображается список товаров с названием, рейтингом, ценой со скидкой и ценой без скидки
  actual-result: |
    На странице всё отображается, кроме рейтинга у товаров

- summary: |
    Не работает закрытие окна заказа через крестик
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавить товар в корзину
    3. Перейти в корзину
    4. Нажать кнопку оформления заказа
    5. Нажать на крестик в окне заказа
  expected-result: |
    Окно заказа закрывается
  actual-result: |
    При нажатии на крестик окно заказа не закрывается

- summary: |
    не работает фильтрация товаров по цене
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. В фильтрации по Price вводим минимальную цену 11.40
    3. В фильтрации по Price вводим максимальную цену 16.50
  expected-result: |
    В каталоге отображаются только товары, соответствующие заданному диапазону цен
  actual-result: |
    В каталоге отображаются не все товары с ценой в этом диапозоне, например товар 16.35

- summary: |
    Не работает оформление заказа
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавляем в карзину любой товар
    3. Открываем корзину
    4. Нажать на кнопку "checkout"
  expected-result: |
    Пользователь переходит в корзину и нажимает на кнопку оформления заказа и далее переходит на страницу оплаты
  actual-result: |
    После перехода в корзину, нет какой-либо кнопки, чтобы перейти к оформлению заказа и далее на страницу оплаты. Есть кнопка "checkout", что предлагает "проверить", после нажатия на нее, появляется плашка, что заказ успешно оформлен

- summary: |
    Не корректно работает адаптивность сайта на мобильном устройстве
  environment: |
    Chrome 151.0.7922.71
    Имя Infinix NOTE 30 Модель Infinix X6833B Экран 1080X2460
  steps-to-reproduce: |
    1. Зайти на страницу с мобильного устройства https://products-store.hexlet.app/
    2. Просматриваем каталог
    3. Открываем страницу товара
    4. Открываем корзину
  expected-result: |
    Все страницы корректно отображаются на мобильном устройстве, элементы интерфейса доступны для использования, горизонтальная прокрутка отсутствует
  actual-result: |
    Визуально страница корзины отображается некорректно, кнопки съехали, фотографий нет, информация выходит за экран (обрезается), страница каталога имеет навигационные панели, которые также некорректно отображаются (полоса перечеркивает панель навигации), прикладываю фото photo_nav.jpg и photo_cart.jpg

