---
- summary: |
    Поиск и фильтрация не учитывают товары с других страниц каталога
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Перейти на следующую страницу каталога.
    3. Запомнить товар, который отображается на следующей странице.
    4. Вернуться на первую страницу каталога.
    5. Ввести в поиск название запомненного товара.
    6. Применить фильтрацию по категории или другим параметрам.
  expected-result: |
    Поиск и фильтрация выполняются по всему каталогу товаров независимо от текущей страницы.
    Товары, соответствующие условиям поиска и фильтрации, отображаются в результатах.
  actual-result: |
    Поиск и фильтрация не находят товары, расположенные на других страницах каталога.

- summary: |
    Отсутствует рейтинг товаров в каталоге
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Просмотреть каталог товаров.
  expected-result: |
    У каждого товара отображается название, рейтинг, цена со скидкой и цена без скидки.
  actual-result: |
    В карточках товаров отсутствует рейтинг.
    Скриншот: [добавить ссылку на скриншот]

- summary: |
    Крестик не закрывает модальное окно оформления заказа
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавить товар в корзину.
    3. Перейти в корзину.
    4. Нажать кнопку оформления заказа (Checkout).
    5. Нажать на крестик в модальном окне.
  expected-result: |
    Модальное окно оформления заказа закрывается при нажатии на крестик.
  actual-result: |
    При нажатии на крестик модальное окно не закрывается.
    При нажатии на кнопку Close окно закрывается.

- summary: |
    Фильтрация по цене не отображает все подходящие товары
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. В фильтре Price указать минимальную цену 11.40.
    3. В фильтре Price указать максимальную цену 16.50.
    4. Просмотреть результаты фильтрации.
  expected-result: |
    В каталоге отображаются все товары, цена которых входит в диапазон от 11.40 до 16.50 включительно.
  actual-result: |
    В результатах фильтрации отсутствуют некоторые товары, соответствующие заданному диапазону цен. Например, не отображается товар стоимостью 16.35.

- summary: |
    Заказ оформляется без перехода на страницу оплаты
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавить любой товар в корзину.
    3. Открыть корзину.
    4. Нажать кнопку Checkout.
  expected-result: |
    После подтверждения оформления заказа пользователь переходит на страницу оплаты.
  actual-result: |
    После нажатия кнопки Checkout появляется сообщение об успешном оформлении заказа. Переход на страницу оплаты не выполняется.

- summary: |
    Нарушено отображение каталога и корзины на мобильном устройстве
  environment: |
    Google Chrome 151.0.7922.71
    Устройство: Infinix NOTE 30 (модель X6833B)
    Разрешение экрана: 1080 × 2460
  steps-to-reproduce: |
    1. Открыть страницу https://products-store.hexlet.app/ на мобильном устройстве.
    2. Просмотреть каталог товаров.
    3. Открыть страницу товара.
    4. Открыть корзину.
  expected-result: |
    Каталог, страница товара и корзина корректно отображаются на мобильном устройстве.
    Элементы интерфейса доступны для использования, содержимое не обрезается, горизонтальная прокрутка отсутствует.
  actual-result: |
    В корзине кнопки смещены, изображения товаров отсутствуют, часть информации выходит за границы экрана и обрезается.
    В каталоге линия перекрывает элементы панели навигации.
    Скриншоты: photo_nav.jpg, photo_cart.jpg

