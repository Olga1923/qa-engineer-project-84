bugreports:
  - summary: |
      В навигационной панели отображается пустой чекбокс
    environment: |
      Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
      ОС Windows 10 10.0.19044 Сборка 19044
      https://products-store.hexlet.app/
    steps-to-reproduce: |
      1. Зайти на страницу https://products-store.hexlet.app/
      2. Просмотреть навигационную панель.
      3. Обратить внимание на элементы навигационной панели.
    expected-result: |
      В навигационной панели отображаются только предусмотренные интерфейсом элементы. Пустой чекбокс отсутствует.
    actual-result: |
      В навигационной панели отображается пустой чекбокс без назначения.
      Скриншот: screenshots/nav2.PNG
