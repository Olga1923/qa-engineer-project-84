bugreports:

- summary: |
    Не работает отображение рейтинга товаров в каталоге
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |

    1. Зайти на страницу https://products-store.hexlet.app/
    2. Просмотреть каталог товаров
  expected-result: |
    На странице отображается список товаров с названием, рейтингом, ценой со скидкой и ценой без скидки.
  actual-result: |
    На странице отображается список товаров, но рейтинг у товаров отсутствует.

- summary: |
    Не работает закрытие модального окна через кнопку «крестик»
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |

    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавить любой товар в корзину.
    3. Перейти в корзину.
    4. Нажать на кнопку «checkout».
    5. Нажать на кнопку «крестик» в модальном окне.
  expected-result: |
    Модальное окно «checkout» закрывается при нажатии на кнопку «крестик» или кнопку «Close».
  actual-result: |
    Модальное окно не закрывается при нажатии на кнопку «крестик».

- summary: |
    Некорректно работает фильтрация товаров по цене
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |

    1. Зайти на страницу https://products-store.hexlet.app/
    2. В фильтрации по Price ввести минимальную цену 11.40.
    3. В фильтрации по Price ввести максимальную цену 16.50.
  expected-result: |
    В каталоге отображаются все товары, соответствующие заданному диапазону цен от 11.40 до 16.50.
  actual-result: |
    В каталоге отображаются не все товары с ценой в заданном диапазоне. Например, товар с ценой 16.35 отсутствует в результатах фильтрации.

- summary: |
    Не работает оформление заказа
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
  steps-to-reproduce: |

    1. Зайти на страницу https://products-store.hexlet.app/
    2. Добавить в корзину любой товар.
    3. Открыть корзину.
    4. Нажать на кнопку «checkout».
  expected-result: |
    Пользователь может перейти к оформлению заказа, после чего переходит на страницу оплаты.
  actual-result: |
    В корзине отсутствует отдельная кнопка для перехода к оформлению заказа и странице оплаты. Кнопка «checkout» предлагает проверить заказ. После нажатия появляется сообщение о том, что заказ успешно оформлен, при этом перехода на страницу оплаты нет.

- summary: |
    Некорректно работает адаптивность сайта на мобильном устройстве
  environment: |
    Chrome 151.0.7922.71
    Устройство: Infinix NOTE 30
    Модель: Infinix X6833B
    Разрешение экрана: 1080x2460
  steps-to-reproduce: |

    1. Зайти на страницу https://products-store.hexlet.app/ с мобильного устройства.
    2. Просмотреть каталог товаров.
    3. Открыть страницу товара.
    4. Открыть корзину.
  expected-result: |
    Все страницы корректно отображаются на мобильном устройстве. Элементы интерфейса доступны для использования, горизонтальная прокрутка отсутствует, изображения и информация о товарах отображаются корректно.
  actual-result: |
    Страница корзины отображается некорректно: кнопки съехали, изображения товаров отсутствуют, часть информации выходит за пределы экрана и обрезается. На странице каталога навигационные панели также отображаются некорректно: полоса перечеркивает панель навигации.
    Для подтверждения проблемы приложены скриншоты photo_nav.jpg и photo_cart.jpg.

- summary: |
    В навигационной панели отображается пустой чекбокс
  environment: |
    Google Chrome 151.0.7922.77 (официальная сборка) (64 бит)
    ОС Windows 10 10.0.19044 Сборка 19044
    https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Зайти на страницу https://products-store.hexlet.app/
    2. Просмотреть навигационную панель.
    3. Обратить внимание на элементы навигационной панели.
  expected-result: |
    В навигационной панели отображаются только предусмотренные интерфейсом элементы. Пустой чекбокс отсутствует.
  actual-result: |
    В навигационной панели отображается пустой чекбокс без назначения. Прикладываю фото nav2.PNG
