---

functional:

- Пользователь должен иметь возможность просматривать каталог товаров.
- Пользователь должен иметь возможность искать товары по ключевому слову.
- Пользователь должен иметь возможность искать товары по категории.
- Пользователь должен иметь возможность фильтровать товары.
- Пользователь должен иметь возможность просматривать товары постранично.
- Пользователь должен иметь возможность просматривать подробную информацию о товаре.
- На странице каталога и странице товара должны отображаться название товара, рейтинг, цена со скидкой и цена без скидки.
- Пользователь должен иметь возможность добавлять товары в корзину.
- Пользователь должен иметь возможность просматривать содержимое корзины.
- Пользователь должен иметь возможность удалять товары из корзины.
- Пользователь должен иметь возможность продолжить покупки из корзины.
- Пользователь должен иметь возможность оформить заказ.
- При оформлении заказа пользователь должен переходить на страницу оплаты.
- Содержимое корзины должно сохраняться в сессии браузера.
- Пользователь должен иметь возможность переключать язык интерфейса.
- Сайт должен поддерживать русский и английский языки.

non-functional:

- Сайт должен иметь адаптивную верстку и корректно отображаться на мобильных устройствах.
- Сайт должен быть доступен на различных типах устройств.
- Сайт должен работать как SPA-приложение без полной перезагрузки страницы при навигации.
- Сайт должен обеспечивать удобство использования и высокую скорость работы.
- Сайт должен быть безопасным и обеспечивать защиту данных пользователя.
- Сайт должен быть протестирован на совместимость с последними версиями популярных браузеров.
- Сайт должен поддерживать работу при большом количестве одновременных пользователей и высоком трафике.
- Сайт должен быть доступен напрямую из сети Интернет без использования VPN.
- Содержимое корзины должно сохраняться в сессии браузера.

implicit:

- При добавлении товара в корзину пользователь должен получать визуальное подтверждение выполненного действия.
- Количество товаров в корзине должно быть доступно для просмотра без перехода на страницу корзины.
- При изменении содержимого корзины итоговая стоимость заказа должна пересчитываться автоматически.
- Товары, отсутствующие в каталоге или недоступные для покупки, не должны добавляться в корзину.
- При переходе между страницами каталога выбранные пользователем фильтры и параметры поиска должны сохраняться.
- При отсутствии результатов поиска или фильтрации пользователь должен получать понятное сообщение.
- Пользователь должен получать понятные сообщения об ошибках при невозможности выполнить операцию.
- Интерфейс должен корректно работать при изменении размера окна браузера и ориентации мобильного устройства.
- Элементы управления должны быть удобны для использования на сенсорных экранах.
- Текст и элементы интерфейса должны корректно отображаться на русском и английском языках без нарушения верстки.
- Данные корзины должны сохраняться при обновлении страницы в рамках браузерной сессии.
- Пользователь должен иметь возможность вернуться из корзины в каталог без потери выбранных товаров.
- Навигация между каталогом, страницей товара и корзиной должна быть понятной и последовательной.
