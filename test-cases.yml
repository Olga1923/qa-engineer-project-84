---
- summary: |
  Проверка отображения каталога товаров
  requirement: |
  Пользователь должен иметь возможность просматривать каталог товаров
  prerequisites: |
  Открыта главная страница интернет-магазина
  test-data: |
  Нет
  steps:
  - Открываем главную страницу
  - Просматриваем каталог товаров
  expected-result: |
    На странице отображается список товаров с названием, рейтингом, ценой со скидкой и ценой без скидки

- summary: |
  Проверка поиска товара по ключевому слову
  requirement: |
  Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
  Открыта страница каталога товаров
  test-data: |
  Ключевое слово = Lipstick
  steps:
  - Вводим в поле поиска значение "Lipstick"
  expected-result: |
    В каталоге отображаются товары, соответствующие введенному ключевому слову

- summary: |
  Проверка поиска товара по категории
  requirement: |
  Пользователь должен иметь возможность искать товары по категории
  prerequisites: |
  Открыта страница каталога товаров
  test-data: |
  Категория = beauty
  steps:
  - Открываем список категорий
  - Выбираем категорию "beauty"
  expected-result: |
    В каталоге отображаются товары выбранной категории

- summary: |
  Проверка фильтрации товаров по цене
  requirement: |
  Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
  Открыта страница каталога товаров
  test-data: |
  Цена от = 7.96
  Цена до = 13.51
  steps:
  - Вводим минимальную цену 7.96
  - Вводим максимальную цену 13.51
  expected-result: |
    В каталоге отображаются только товары, соответствующие заданному диапазону цен

- summary: |
  Проверка фильтрации товаров по бренду
  requirement: |
  Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
  Открыта страница каталога товаров
  test-data: |
  Бренд = Dior
  steps:
  - Выбираем бренд "Dior"
  expected-result: |
    В каталоге отображаются товары выбранного бренда

- summary: |
  Проверка постраничного отображения каталога
  requirement: |
  Пользователь должен иметь возможность просматривать товары постранично
  prerequisites: |
  Открыта страница каталога с товарами
  test-data: |
  Нет
  steps:
  - Нажимаем кнопку перехода на следующую страницу
  expected-result: |
    Отображается следующая страница каталога без полной перезагрузки приложения

- summary: |
  Проверка открытия страницы товара
  requirement: |
  Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Любой товар из каталога
  steps:
  - Нажимаем на карточку товара
  expected-result: |
    Открывается страница товара с подробной информацией о нем

- summary: |
  Проверка информации на странице товара
  requirement: |
  На странице товара должны отображаться название, рейтинг, цена со скидкой и цена без скидки
  prerequisites: |
  Открыта страница конкретного товара
  test-data: |
  Любой товар со скидкой
  steps:
  - Просматриваем информацию о товаре
  expected-result: |
    Отображаются название товара, рейтинг, цена со скидкой и цена без скидки

- summary: |
  Проверка добавления товара в корзину
  requirement: |
  Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Любой доступный товар
  steps:
  - Нажимаем кнопку "В корзину" у товара
  expected-result: |
    Товар добавляется в корзину, количество товаров в корзине увеличивается

- summary: |
  Проверка добавления нескольких товаров в корзину
  requirement: |
  Пользователь должен иметь возможность добавлять товары в корзину и продолжать выбирать товары в каталоге
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Товар 1 = Powder Canister
  Товар 2 = Red Nail Polish
  steps:
  - Добавляем в корзину первый товар
  - Остаемся в каталоге
  - Добавляем в корзину второй товар
  - Открываем корзину
  expected-result: |
    В корзине отображаются оба выбранных товара

- summary: |
  Проверка содержимого корзины
  requirement: |
  Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
  В корзину добавлен хотя бы один товар
  test-data: |
  Любой товар
  steps:
  - Открываем корзину
  expected-result: |
    В корзине отображается добавленный товар и информация о нем

- summary: |
  Проверка удаления товара из корзины
  requirement: |
  Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
  В корзине находится хотя бы один товар
  test-data: |
  Любой товар
  steps:
  - Открываем корзину
  - Нажимаем кнопку удаления товара
  expected-result: |
    Выбранный товар удаляется из корзины

- summary: |
  Проверка возврата из корзины в каталог
  requirement: |
  Пользователь должен иметь возможность продолжить выбирать товары из корзины
  prerequisites: |
  Открыта корзина
  test-data: |
  Нет
  steps:
  - Нажимаем кнопку "Продолжить покупки"
  expected-result: |
    Пользователь возвращается в каталог товаров

- summary: |
  Проверка сохранения корзины после обновления страницы
  requirement: |
  Содержимое корзины должно сохраняться в сессии браузера
  prerequisites: |
  В корзину добавлен товар
  test-data: |
  Любой товар
  steps:
  - Добавляем товар в корзину
  - Обновляем страницу браузера
  - Открываем корзину
  expected-result: |
    Добавленный ранее товар остается в корзине

- summary: |
  Проверка оформления заказа
  requirement: |
  Пользователь должен иметь возможность оформить заказ
  prerequisites: |
  В корзине находится хотя бы один товар
  test-data: |
  Любой товар
  steps:
  - Открываем корзину
  - Нажимаем кнопку оформления заказа
  expected-result: |
    Пользователь переходит к оформлению заказа и далее на страницу оплаты

- summary: |
  Проверка переключения языка интерфейса на английский
  requirement: |
  Пользователь должен иметь возможность переключать язык интерфейса
  prerequisites: |
  Открыта главная страница магазина
  test-data: |
  Язык = English
  steps:
  - Открываем раскладку языка
  - Выбираем English
  expected-result: |
    Интерфейс сайта отображается на английском языке

- summary: |
  Проверка переключения языка интерфейса на русский
  requirement: |
  Сайт должен иметь локализацию на русский и английский языки
  prerequisites: |
  Открыта главная страница магазина на английском языке
  test-data: |
  Язык = Русский
  steps:
  - Открываем раскладку языка
  - Выбираем русский язык
  expected-result: |
    Интерфейс сайта отображается на русском языке

- summary: |
  Проверка совместной работы поиска и фильтрации
  requirement: |
  Пользователь должен иметь возможность искать и фильтровать товары
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Ключевое слово = Dior J'adore
  Бренд = Dior
  steps:
  - Вводим в поиск "Dior J'adore"
  - Выбираем бренд "Dior"
  expected-result: |
    В каталоге отображаются товары, соответствующие одновременно поисковому запросу и выбранному фильтру

- summary: |
  Проверка отсутствия результатов поиска
  requirement: |
  Пользователь должен получать понятное сообщение при отсутствии товаров по запросу
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Ключевое слово = noyyes
  steps:
  - Вводим в поле поиска "noyyes"
  expected-result: |
    Товары не отображаются и пользователь получает понятное сообщение об отсутствии результатов

- summary: |
  Проверка адаптивности сайта на мобильном устройстве
  requirement: |
  Сайт должен иметь адаптивную верстку и быть доступен на различных устройствах
  prerequisites: |
  Открыта главная страница магазина
  test-data: |
  Разрешение экрана = 375x667
  steps:
  - Открываем DevTools
  - Выбираем разрешение экрана "375x667"
  - Просматриваем каталог
  - Открываем страницу товара
  - Открываем корзину
  expected-result: |
    Все страницы корректно отображаются на мобильном устройстве, элементы интерфейса доступны для использования, горизонтальная прокрутка отсутствует

- summary: |
  Проверка SPA-навигации без полной перезагрузки страницы
  requirement: |
  Сайт должен работать как SPA-приложение без полной перезагрузки страницы при навигации
  prerequisites: |
  Открыта главная страница магазина
  test-data: |
  Нет
  steps:
  - Переходим из каталога на страницу товара
  - Возвращаемся в каталог
  - Открываем корзину
  expected-result: |
    Переходы между разделами выполняются без полной перезагрузки страницы

- summary: |
  Проверка отображения количества товаров в корзине
  requirement: |
  Пользователь должен иметь возможность контролировать содержимое корзины
  prerequisites: |
  Открыта страница каталога
  test-data: |
  Товар 1 = Powder Canister
  Товар 2 = Red Lipstick
  steps:
  - Добавляем первый товар в корзину
  - Добавляем второй товар в корзину
  - Просматриваем индикатор корзины
  expected-result: |
    Индикатор корзины отображает актуальное количество добавленных товаров

- summary: |
  Проверка пересчета общей стоимости корзины
  requirement: |
  При изменении содержимого корзины итоговая стоимость заказа должна пересчитываться автоматически
  prerequisites: |
  В корзину добавлены товары
  test-data: |
  Товар 1 = Powder Canister
  Товар 2 = Red Lipstick
  steps:
  - Открываем корзину
  - Запоминаем общую стоимость
  - Удаляем один товар
  expected-result: |
    Общая стоимость корзины автоматически пересчитывается с учетом удаленного товара
